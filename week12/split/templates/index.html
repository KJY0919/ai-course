<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>나눠 내기 계산기</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        .container {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: #2c3e50;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box; /* Ensures padding doesn't affect width */
            -webkit-appearance: none; /* Removes iOS default styling */
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:active {
            background-color: #2980b9;
        }
        .result {
            margin-top: 25px;
            padding: 20px;
            background-color: #e8f6fd;
            border-radius: 8px;
            text-align: center;
        }
        .result-val {
            display: block;
            font-size: 1.8rem;
            font-weight: bold;
            color: #2980b9;
            margin-top: 5px;
        }
        .error {
            color: #e74c3c;
            background-color: #fadbd8;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 0.9rem;
        }
        .summary {
            font-size: 0.85rem;
            color: #7f8c8d;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💸 나눠 내기</h1>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label for="total_amount">총 금액 (원)</label>
                <input type="number" id="total_amount" name="total_amount" placeholder="예: 50000" required inputmode="decimal">
            </div>
            <div class="form-group">
                <label for="people_count">인원 수 (명)</label>
                <input type="number" id="people_count" name="people_count" placeholder="예: 4" required inputmode="numeric">
            </div>
            <button type="submit">계산하기</button>
        </form>

        {% if per_person is not none %}
            <div class="result">
                <div>1인당 내야 할 금액</div>
                <span class="result-val">{{ "{:,.0f}".format(per_person) }}원</span>
                <div class="summary">
                    총 {{ "{:,.0f}".format(total_amount) }}원을 {{ people_count }}명으로 나눴습니다.
                </div>
            </div>
        {% endif %}
    </div>
</body>
</html>
